[package]
name = "lyng-cli"
version.workspace = true
edition.workspace = true
default-run = "lyng"

[[bin]]
name = "lyng"
path = "src/main.rs"

[features]
# Forwards to `lyng-vm`'s feature of the same name. When enabled, the
# `lyng` binary supports `--dump-ic-counters` and bumps IC slow-path
# counters / opcode dispatch counters on every slow entry. OFF by
# default so production builds carry zero counter code.
diagnostic-counters = ["lyng-vm/diagnostic-counters"]

[dependencies]
lyng-builtins = { workspace = true }
lyng-common = { workspace = true }
lyng-compiler = { workspace = true }
lyng-env = { workspace = true }
lyng-host = { workspace = true }
lyng-ops = { workspace = true }
lyng-parser = { workspace = true }
lyng-sema = { workspace = true }
lyng-test262-harness = { workspace = true }
lyng-types = { workspace = true }
lyng-vm = { workspace = true }

[lints]
workspace = true
