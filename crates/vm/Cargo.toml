[package]
name = "lyng-vm"
version.workspace = true
edition.workspace = true

[features]
default = []
# Opt-in dispatch instrumentation. Adds per-Vm opcode counters
# (`Vm::enable_opcode_dispatch_counts` and friends) plus a counted
# variant of `run_trampoline` that records each dispatched opcode.
# Production builds (`lyng-cli`) leave this off so the binary
# carries no counter code in `.text`; dev tools (`lyng-bench`) enable
# it via their Cargo.toml dep spec.
#
# Build-time isolation note: Cargo features unify across the dep graph.
# Build the production binary with `-p lyng-cli` (no feature) and
# the bench tool with `-p lyng-bench` (which pulls the feature
# transitively). Avoid bare `cargo build --release` if you need the
# counter-free production binary in the same `target/` cache.
diagnostic-counters = []

[dependencies]
lyng-builtins = { workspace = true }
lyng-common = { workspace = true }
lyng-types = { workspace = true }
lyng-gc = { workspace = true }
lyng-ops = { workspace = true }
lyng-host = { workspace = true }
lyng-objects = { workspace = true }
lyng-env = { workspace = true }
lyng-bytecode = { workspace = true }
lyng-parser = { workspace = true }
lyng-sema = { workspace = true }
lyng-compiler = { workspace = true }
lyng-vm-dsl = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "property_addition"
harness = false

[lints]
workspace = true
