[package]
name = "lyng-js-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lyng-js-builtins.workspace = true
lyng-js-bytecode.workspace = true
lyng-js-common.workspace = true
lyng-js-compiler.workspace = true
lyng-js-env.workspace = true
lyng-js-gc.workspace = true
lyng-js-host.workspace = true
lyng-js-parser.workspace = true
lyng-js-sema.workspace = true
lyng-js-test262 = { path = "../lyng-js-test262" }
lyng-js-types.workspace = true
# `opcode-counters` enables the `Vm::enable_opcode_dispatch_counts` API and
# the counted-trampoline path that `lyng-js-bench runtime --count-opcodes`
# relies on. Production builds (`-p lyng-js-cli`) leave the feature off so
# the `lyng-js` binary carries no counter code (`lyng-3lqp`).
lyng-js-vm = { workspace = true, features = ["opcode-counters"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
