# Hot-opcode configuration for the asm-DSL substrate.
#
# The `hot` list is the top-30 opcodes by measured dispatch share on the
# V8 v7 benchmark suite (see reports/lyng/r0/v8-v7-top30.tsv for
# the source data; refresh when the compiler emits a major new pattern).
#
# `target_slow_path_share` is the DSL-1 invariant: each hot opcode must
# measure < this fraction of slow-path-semantic share on V8 v7 workloads.
# Default 0.20; per-opcode overrides are allowed with justification.
#
# `aarch64_max_instructions` and `x86_64_max_instructions` are the
# asm-diff per-handler budgets (instructions, not bytes) used by
# `lyng-bench asm-diff`. Calibrated in DSL-0b from real measurements.
# Placeholder values here (0 = no enforcement); update during DSL-0b.

[meta]
source_data = "reports/lyng/r0/v8-v7-top30.tsv"
refresh_command = "cargo run --release -p lyng-bench --features lyng-vm/opcode-counters -- v8suite --count-opcodes --counts-json /tmp/r0-opcode-counts.json"
default_target_slow_path_share = 0.20

[[opcodes]]
name = "Move"
target_slow_path_share = 0.20
aarch64_max_instructions = 0
x86_64_max_instructions = 0

[[opcodes]]
name = "Add"
target_slow_path_share = 0.20
aarch64_max_instructions = 0
x86_64_max_instructions = 0

[[opcodes]]
name = "GetKeyedProperty"
target_slow_path_share = 0.20
aarch64_max_instructions = 0
x86_64_max_instructions = 0

[[opcodes]]
name = "Mul"
target_slow_path_share = 0.20
# DSL-1 Phase 1.C.1: inline DSL port landed. Budget = measured + 2.
# Captured from reports/lyng/dsl-asm-baseline-aarch64/op_mul.asm
# (40 instructions in the inline fast path through bl record_smi —
# 4 more than op_sub because mul_smi_overflow! emits 7 instructions
# vs sub_smi_overflow!'s 3 to honor ECMAScript -0 semantics on
# `(-1) * 0`-style products).
# Slow-path-share measurement currently artificially 100% due to
# call_slow! counter-injection artifact (Phase 1.C followup tracked
# in the per-opcode report).
aarch64_max_instructions = 42
x86_64_max_instructions = 0

[[opcodes]]
name = "Increment"
target_slow_path_share = 0.20
# DSL-1 Phase 1.C.3: inline DSL port landed. Budget = measured + 2.
# Captured from reports/lyng/dsl-asm-baseline-aarch64/op_increment.asm
# (27 instructions in the inline fast path through bl record_smi —
# substantially shorter than the binary inline ports because op_increment
# is unary: a single source register saves the rhs decode/check_smi/untag
# triplet (1 ldr + 7 check_smi + 1 sxtw = 9 instructions). The `adds wD,
# wS, #1` immediate form from inc_smi_overflow! keeps the increment core
# at 3 instructions (adds + b.vs + sxtw).
# Slow-path-share measurement currently artificially 100% due to
# call_slow! counter-injection artifact (Phase 1.C followup tracked
# in the per-opcode report).
aarch64_max_instructions = 29
x86_64_max_instructions = 0

[[opcodes]]
name = "GetNamedProperty"
target_slow_path_share = 0.20
aarch64_max_instructions = 0
x86_64_max_instructions = 0

[[opcodes]]
name = "LoadSmi8"
target_slow_path_share = 0.20
# DSL-1 Phase 1.A: inline DSL port landed at commit 172d54ea (12 instr measured).
# Budget = 14 (measured 12, +2 headroom for LLVM rewrite noise).
aarch64_max_instructions = 14
x86_64_max_instructions = 0

