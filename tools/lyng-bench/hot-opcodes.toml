[[opcodes]]
name = "Decrement"
target_slow_path_share = 0.20
# DSL-1 Phase 1.C.3: inline DSL port landed. Budget = measured + 2.
# Captured from reports/lyng/dsl-asm-baseline-aarch64/op_decrement.asm
# (27 instructions in the inline fast path through bl record_smi — identical
# to op_increment because the two unary update ops share the same shape;
# only the arith mnemonic differs (subs vs adds). `dec_smi_overflow!` uses
# the `subs wD, wS, #1` immediate form (12-bit unsigned), no scratch-register
# dance, 3 instructions total (subs + b.vs + sxtw). Overflow only at i32::MIN.
# Slow-path-share measurement currently artificially 100% due to
# call_slow! counter-injection artifact (Phase 1.C followup tracked
# in the per-opcode report).
aarch64_max_instructions = 29
x86_64_max_instructions = 0

[[opcodes]]
name = "BitAnd"
target_slow_path_share = 0.20
# DSL-1 Phase 1.C.2: inline DSL port landed. Budget = measured + 2.
# Captured from reports/lyng/dsl-asm-baseline-aarch64/op_bit_and.asm
# (35 instructions in the inline fast path through bl record_smi —
# 1 fewer than op_sub because bit_and_smi! has no overflow branch
# (and + sxtw, vs sub_smi_overflow!'s subs + b.vs + sxtw)).
# Slow-path-share measurement currently artificially 100% due to
# call_slow! counter-injection artifact (Phase 1.C followup).
aarch64_max_instructions = 37
x86_64_max_instructions = 0

[[opcodes]]
name = "ShiftLeft"
target_slow_path_share = 0.20
# DSL-1 Phase 1.C.2: inline DSL port landed. Budget = measured + 2.
# Captured from reports/lyng/dsl-asm-baseline-aarch64/op_shift_left.asm
# (36 instructions in the inline fast path through bl record_smi —
# +1 vs op_bit_and because shift_left_smi! is 3 instructions (and+lsl+sxtw)
# vs bit_and_smi!'s 2 (and+sxtw). The extra `and w16, rhs, #0x1f` masks the
# rhs to its low 5 bits per ECMAScript << / ToUint32 semantics).
# Slow-path-share measurement currently artificially 100% due to
# call_slow! counter-injection artifact (Phase 1.C followup).
aarch64_max_instructions = 38
x86_64_max_instructions = 0

