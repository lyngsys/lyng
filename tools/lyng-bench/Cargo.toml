[package]
name = "lyng-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lyng-builtins.workspace = true
lyng-bytecode.workspace = true
lyng-common.workspace = true
lyng-compiler.workspace = true
lyng-env.workspace = true
lyng-gc.workspace = true
lyng-host.workspace = true
lyng-parser.workspace = true
lyng-sema.workspace = true
lyng-test262 = { path = "../lyng-test262" }
lyng-types.workspace = true
# `diagnostic-counters` enables `Vm::enable_opcode_dispatch_counts`, the
# counted-trampoline path that `lyng-bench runtime --count-opcodes` relies on,
# and the IC slow-path entry counters dumped via `--dump-ic-counters`.
# Production builds (`-p lyng-cli`) leave the feature off so the `lyng` binary
# carries no counter code.
lyng-vm = { workspace = true, features = ["diagnostic-counters"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempdir = "0.3"

[lints]
workspace = true
