[workspace]
resolver = "2"
members = [
    # Lyng JS engine
    "crates/common",
    "crates/lexer",
    "crates/ast",
    "crates/parser",
    "crates/sema",
    "crates/types",
    "crates/gc",
    "crates/ops",
    "crates/host",
    "crates/objects",
    "crates/env",
    "crates/bytecode",
    "crates/compiler",
    "crates/vm",
    "crates/builtins",
    "crates/cli",
    "crates/test262-harness",
    "crates/tests",
    "crates/vm-dsl",
    # Tools
    "tools/lyng-bench",
    "tools/lyng-dsl-codegen",
    "tools/lyng-test262",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bitflags = "2"
hashbrown = "0.15"
itoa = "1"
log = "0.4"
memchr = "2"
ryu = "1"
smallvec = "1"
unicode-id-start = "1"

# Lyng JS engine
lyng-common = { path = "crates/common" }
lyng-lexer = { path = "crates/lexer" }
lyng-ast = { path = "crates/ast" }
lyng-parser = { path = "crates/parser" }
lyng-sema = { path = "crates/sema" }
lyng-types = { path = "crates/types" }
lyng-gc = { path = "crates/gc" }
lyng-ops = { path = "crates/ops" }
lyng-host = { path = "crates/host" }
lyng-objects = { path = "crates/objects" }
lyng-env = { path = "crates/env" }
lyng-bytecode = { path = "crates/bytecode" }
lyng-compiler = { path = "crates/compiler" }
lyng-vm = { path = "crates/vm" }
lyng-vm-dsl = { path = "crates/vm-dsl" }
lyng-builtins = { path = "crates/builtins" }
lyng-cli = { path = "crates/cli" }
lyng-test262-harness = { path = "crates/test262-harness" }
lyng-tests = { path = "crates/tests" }

[profile.release]
# Thin LTO enables cross-crate inlining of the VM dispatch helpers
# (`read_register`, `decode_*_operands`, `lyng_ops::*`) into the
# `Vm::run_dispatch_loop` hot path. Without it, the per-arm work of the
# single-loop dispatch sits behind an out-of-line call into `lyng-ops`,
# defeating the jump-table fast path.
lto = "thin"
