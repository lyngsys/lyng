[workspace]
resolver = "2"
members = [
    # Lyng JS engine
    "crates/lyng/common",
    "crates/lyng/lexer",
    "crates/lyng/ast",
    "crates/lyng/parser",
    "crates/lyng/sema",
    "crates/lyng/types",
    "crates/lyng/gc",
    "crates/lyng/ops",
    "crates/lyng/host",
    "crates/lyng/objects",
    "crates/lyng/env",
    "crates/lyng/bytecode",
    "crates/lyng/compiler",
    "crates/lyng/vm",
    "crates/lyng/builtins",
    "crates/lyng/cli",
    "crates/lyng/test262-harness",
    "crates/lyng/tests",
    "crates/lyng/vm-dsl",
    # Tools
    "tools/lyng-bench",
    "tools/lyng-dsl-codegen",
    "tools/lyng-test262",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bitflags = "2"
hashbrown = "0.15"
itoa = "1"
log = "0.4"
memchr = "2"
ryu = "1"
smallvec = "1"
unicode-id-start = "1"

# Lyng JS engine
lyng-common = { path = "crates/lyng/common" }
lyng-lexer = { path = "crates/lyng/lexer" }
lyng-ast = { path = "crates/lyng/ast" }
lyng-parser = { path = "crates/lyng/parser" }
lyng-sema = { path = "crates/lyng/sema" }
lyng-types = { path = "crates/lyng/types" }
lyng-gc = { path = "crates/lyng/gc" }
lyng-ops = { path = "crates/lyng/ops" }
lyng-host = { path = "crates/lyng/host" }
lyng-objects = { path = "crates/lyng/objects" }
lyng-env = { path = "crates/lyng/env" }
lyng-bytecode = { path = "crates/lyng/bytecode" }
lyng-compiler = { path = "crates/lyng/compiler" }
lyng-vm = { path = "crates/lyng/vm" }
lyng-vm-dsl = { path = "crates/lyng/vm-dsl" }
lyng-builtins = { path = "crates/lyng/builtins" }
lyng-cli = { path = "crates/lyng/cli" }
lyng-test262-harness = { path = "crates/lyng/test262-harness" }
lyng-tests = { path = "crates/lyng/tests" }

[profile.release]
# Thin LTO enables cross-crate inlining of the VM dispatch helpers
# (`read_register`, `decode_*_operands`, `lyng_ops::*`) into the
# `Vm::run_dispatch_loop` hot path. Without it, the per-arm work of the
# single-loop dispatch sits behind an out-of-line call into `lyng-ops`,
# defeating the jump-table fast path.
lto = "thin"
